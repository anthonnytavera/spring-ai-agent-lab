spring.application.name=spring-ai-agent-lab

# =====================================================================================
# MODELO DE LENGUAJE
# Estas propiedades usan el starter de OpenAI, que habla el protocolo "OpenAI Chat
# Completions". Muchos proveedores lo implementan, así que basta cambiar la URL, la clave
# y el modelo. Para otro tipo de proveedor (Anthropic, Ollama...) ver "Cambiar de proveedor"
# en el README.
# =====================================================================================

# URL base del proveedor. El cliente le añade "/chat/completions", por eso termina en /v1.
# Proveedor actual: OpenCode Go (suscripción). Ojo: la ruta "/inference/go/..." usa el plan Go;
# la ruta "/inference/openai/..." cobra del saldo prepago y da error 402 si el saldo es 0.
spring.ai.openai.base-url=https://opencode.ai/inference/go/openai/v1

# Clave de API: NUNCA se escribe aquí. Se lee de la variable de entorno OPENCODE_API_KEY.
# Si la variable no existe, la aplicación no arranca (así el fallo es inmediato y claro).
spring.ai.openai.api-key=${OPENCODE_API_KEY}

# Modelo a usar. Debe ser uno que soporte "tool calling" y que el plan permita (ver README).
spring.ai.openai.chat.model=deepseek-v4.1-flash

# Temperatura: 0.0 = respuestas lo más deterministas posible. Conviene en un agente que genera
# SQL; valores altos añaden creatividad, que aquí solo aumenta los errores.
spring.ai.openai.chat.temperature=0.0

# Cabecera HTTP con la que se envía el id de conversación al proveedor (OpenCode la exige para
# enrutar las peticiones). Con otros proveedores, déjala vacía: "agent.session-header="
agent.session-header=x-opencode-session

# =====================================================================================
# BASE DE DATOS (H2 en memoria)
# Se crea al arrancar con schema.sql (tablas y usuario de solo lectura) y data.sql (datos
# de ejemplo). Al detener la aplicación, los datos desaparecen.
# =====================================================================================

# DB_CLOSE_DELAY=-1 mantiene la base viva mientras viva la JVM, aunque no haya conexiones abiertas.
spring.datasource.url=jdbc:h2:mem:agentdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 en http://localhost:8080/h2-console (URL JDBC: jdbc:h2:mem:agentdb).
spring.h2.console.enabled=true

# =====================================================================================
# CONEXIÓN DE SOLO LECTURA DEL AGENTE
# Las tools NO usan la conexión de arriba (usuario "sa", administrador), sino esta, con un
# usuario creado en schema.sql que solo puede hacer SELECT sobre las tres tablas.
# La contraseña está aquí porque es una base en memoria de laboratorio; en un proyecto real
# iría en una variable de entorno o un gestor de secretos.
# =====================================================================================

# Sin ";DB_CLOSE_DELAY=-1": esa opción ejecuta un SET que exige permisos de administrador y
# el usuario de solo lectura no los tiene. Se conecta igualmente a la misma base en memoria.
agent.datasource.url=jdbc:h2:mem:agentdb
agent.datasource.username=agent_ro
agent.datasource.password=agent_ro

# =====================================================================================
# DOCUMENTACIÓN DE LA API (Swagger)
# =====================================================================================

# Interfaz de Swagger: http://localhost:8080/swagger-ui.html  |  Especificación: /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# =====================================================================================
# LOGS
# =====================================================================================

# En DEBUG se ve cada tool que el modelo pide ejecutar. Útil para aprender cómo razona el agente;
# en un entorno real conviene volver a INFO para no llenar los logs.
logging.level.org.springframework.ai=DEBUG
